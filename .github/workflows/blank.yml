name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build Next.js Application
        run: npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".github" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}

      - name: Install Production Dependencies & Restart PM2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.EC2_HOST }} << EOF
          cd ${{ secrets.APP_DIR }}
          npm ci --omit=dev
          pm2 reload ${{ secrets.PM2_PROCESS_NAME }} || pm2 start ecosystem.config.js
          EOF

      - name: Verify Deployment
        run: |
          sleep 10
          curl -f https://${{ secrets.STAGING_DOMAIN }}/ || exit 1
